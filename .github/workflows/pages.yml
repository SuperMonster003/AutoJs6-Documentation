name: Deploy documentation site

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docsify site
        shell: bash
        run: |
          set -euo pipefail
          test -f api/index.html
          test -f api/overview.md
          test -f api/sidebar.md
          test -f api/static/docsify-config.js
          # This records the domain convention; Pages Settings remains authoritative.
          test "$(cat api/CNAME)" = "docs.autojs6.com"
          ! find api -type l -print -quit | grep -q .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./api

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
